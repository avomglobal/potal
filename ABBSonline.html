<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Portal</title>
<style>
  :root{
    --ink:#1d2b26; --muted:#5d6b66; --line:#d9ded9; --paper:#f1f3ef; --white:#fff;
    --brand:#0f4c3a; --brand-2:#17694f; --accent:#e0a526; --drawer:#1b2622; --drawer-2:#25322d;
    --note-bg:#fdf2d0; --note-line:#ecd68b; --note-ink:#6b4f06;
    --info-bg:#dff1ee; --info-line:#a9d6cf; --info-ink:#0c5147;
    --ok:#2f7d4f; --bad:#b3372c;
    --serif:Georgia,"Times New Roman",serif; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100vh;padding-top:60px;padding-bottom:78px;line-height:1.5}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--brand-2)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* top bar */
  .topbar{position:fixed;top:0;left:0;right:0;height:60px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20}
  .icon-btn{background:none;border:0;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;cursor:pointer}
  .icon-btn:hover{background:var(--paper)}
  .brand{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--brand);letter-spacing:.2px}
  .brand small{display:block;font-family:var(--sans);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.6px;margin-top:-3px}
  .top-right{display:flex;align-items:center;gap:4px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:var(--muted)}
  .badge-dot{position:relative}
  .badge-dot::after{content:"";position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid #fff}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--drawer);color:#e8ede9;transform:translateX(-100%);transition:transform .22s ease;z-index:50;overflow-y:auto}
  .drawer.open{transform:none}
  .profile{padding:28px 18px 20px;text-align:center;background:linear-gradient(135deg,#0f4c3a,#1d7a5a 55%,#c99a2b);color:#fff}
  .profile .big-avatar{width:84px;height:84px;border-radius:50%;background:#d6dad7;margin:0 auto 10px;display:grid;place-items:center;color:#8a948f}
  .profile h2{font-family:var(--serif);font-size:20px}
  .profile .meta{font-size:13px;opacity:.92;margin-top:2px}
  .profile .status{margin-top:8px;font-size:13px}
  .profile .status b{letter-spacing:.3px}
  .nav-title{padding:18px 18px 8px;font-size:13px;color:#8d9a94}
  .nav-item{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font-size:16px}
  .nav-item:hover{background:var(--drawer-2)}
  .nav-item.active{background:var(--accent);color:#2a2000}
  .nav-item .chev{margin-left:auto;transition:transform .2s}
  .nav-item[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .sub{display:none;background:#151d1a}
  .sub.open{display:block}
  .sub button{display:block;width:100%;text-align:left;padding:12px 18px 12px 58px;background:none;border:0;color:#c9d3ce;cursor:pointer;font-size:15px}
  .sub button:hover{background:var(--drawer-2)}
  .nav-sep{border:0;border-top:1px solid #34423c;margin:10px 18px}

  /* bottom tabs */
  .tabs{position:fixed;left:0;right:0;bottom:0;height:70px;background:var(--white);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  .tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
  .tab svg{width:24px;height:24px}
  .tab.active{color:var(--brand)}
  .tab.center{position:relative}
  .tab.center .orb{position:absolute;top:-22px;width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(15,76,58,.4)}
  .tab.center span.lbl{margin-top:34px}

  /* page */
  main{max-width:720px;margin:0 auto;padding:22px 16px 30px}
  h1{font-family:var(--serif);font-size:30px;line-height:1.15;padding-bottom:12px;position:relative;margin-bottom:18px}
  h1::after{content:"";position:absolute;left:0;bottom:0;width:90px;height:3px;background:var(--brand)}
  .lead{margin-bottom:16px;color:#34423c}
  .note,.info{border-radius:8px;padding:14px 16px;margin:14px 0;font-size:15px}
  .note{background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-ink)}
  .info{background:var(--info-bg);border:1px solid var(--info-line);color:var(--info-ink)}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:8px;margin:16px 0;overflow:hidden}
  .panel > header{padding:14px 16px;background:#f7f8f6;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:19px;font-weight:700}
  .panel .body{padding:16px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #b9c1bb;border-radius:6px;background:#fff;font-size:16px}
  .field input[readonly]{background:#eef0ed;color:#46544e}
  .field textarea{min-height:120px;resize:vertical}
  .hint{font-size:13px;color:var(--muted);margin-top:4px}
  .err{color:var(--bad);font-size:13px;margin-top:4px;display:none}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad)}
  .field.invalid .err{display:block}
  .check{display:flex;gap:10px;align-items:flex-start}
  .check input{width:20px;height:20px;margin-top:3px;flex:none}
  .check label{font-weight:400;margin:0}
  .btn{display:inline-block;border:0;border-radius:8px;padding:13px 22px;font-weight:600;cursor:pointer;font-size:16px}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-2)}
  .btn.ghost{background:#fff;border:1px solid var(--brand);color:var(--brand)}
  .btn.block{width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap}

  /* steps */
  .step{background:#fff;border:1px solid var(--line);border-radius:8px;margin:10px 0}
  .step summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:600}
  .step summary::-webkit-details-marker{display:none}
  .pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
  .pill.done{background:#d9f0e1;color:#1d6a3d}
  .pill.todo{background:#fde6c8;color:#8a5200}
  .step .inner{padding:0 16px 16px;color:#34423c;font-size:15px}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .stat div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
  .stat b{display:block;font-size:22px;font-family:var(--serif)}
  .stat span{font-size:13px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:15px}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#f7f8f6;font-size:13px}

  .sub{position:relative}
  .sub::before{content:"";position:absolute;left:38px;top:8px;bottom:8px;width:2px;background:#3a4842}
  .sub button::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#8d9a94;margin:0 14px 1px -22px}
  .sub button.active{color:#fff}
  .sub button.active::before{background:var(--accent)}
  .field label input,.field label select,.field label textarea{font-weight:400;margin-top:5px}
  .field label.chip{display:inline-flex;font-weight:400;margin:0}
  .field .chip input{width:auto;padding:0;margin:0}
  .chip{align-items:center;gap:6px;border:1px solid #b9c1bb;border-radius:99px;padding:8px 14px;background:#fff;cursor:pointer}
  .hero{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
  .hero-top{background:linear-gradient(135deg,#0f4c3a,#1d7a5a 55%,#c99a2b);color:#fff;text-align:center;padding:26px 16px 90px}
  .hero-top h2{font-family:var(--serif);font-size:24px}
  .hero-photo{width:132px;height:132px;border-radius:50%;margin:-76px auto 0;background:linear-gradient(#e4e6e4,#c3c8c4);border:6px solid #fff;box-shadow:0 0 0 4px #b9b09a;display:grid;place-items:center;text-align:center;font-weight:700;font-size:15px;padding:18px;position:relative}
  .badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:20px 12px 22px}
  .badge{background:var(--accent);color:#2a2000;font-weight:700;font-size:15px;padding:7px 14px;border-radius:6px}
  .linklist button{display:flex;align-items:center;gap:20px;width:100%;padding:17px 22px;background:#fff;border:0;border-top:1px solid var(--line);text-align:left;font-size:17px;cursor:pointer;color:#34423c}
  .linklist button:hover{background:#f7f8f6}
  .linklist svg{width:24px;height:24px;color:#4a5752;fill:currentColor;flex:none}
  .program{border-radius:8px;background:linear-gradient(135deg,#6d4f10,#a9791f);color:#fff;padding:20px 18px 26px}
  .program .tag{display:inline-block;background:#fff;color:var(--ink);font-weight:700;font-size:14px;padding:5px 12px;border-radius:6px;margin-bottom:10px}
  .program h3{font-family:var(--serif);font-size:26px;line-height:1.2;font-weight:400}
  .mtable{border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
  .mhead,.mrow{display:grid;grid-template-columns:1.5fr 1fr auto;gap:10px;align-items:center;padding:12px}
  .mhead{background:#2d3a35;color:#fff;font-weight:700;font-size:14px;border-bottom:3px solid var(--brand)}
  .mgroup{background:#e6e9e5;padding:14px 12px;font-family:var(--serif);font-size:18px}
  .mgroup small{display:block;font-size:14px;color:#8a5a00;font-family:var(--sans)}
  .mrow{border-top:1px solid var(--line)}
  .mrow a{font-weight:600;display:block}
  .mrow small{color:var(--muted)}
  .status-pill{background:#6b7570;color:#fff;font-size:13px;font-weight:600;padding:6px 10px;border-radius:99px;text-align:center}
  .btn-offers{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:10px 12px;font-weight:600;cursor:pointer}
  .foot{margin-top:34px;color:var(--muted);font-size:15px}
  .foot h4{margin:20px 0 8px;color:var(--ink);font-size:16px}
  .foot a{display:block;margin:6px 0}
  .foot p a{display:inline;margin:0}
  body.auth{padding:0}
  body.auth .topbar,body.auth .tabs,body.auth .drawer,body.auth .scrim{display:none}
  .auth-card{max-width:420px;margin:0 auto;padding:36px 18px}
  .auth-card .brand{margin-bottom:26px}
  .auth-card p{margin-top:14px;text-align:center}
  .arow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;cursor:pointer}
  .arow small{display:block;color:var(--muted);font-size:13px;font-weight:400}
  .pill.bad{background:#f6d4d0;color:#8c2a20}
  .status-pill.ok{background:#2f7d4f}
  .status-pill.wait{background:#a9791f}
  .dl{margin-bottom:6px}
  .dl dt{font-size:13px;color:var(--muted)}
  .dl dd{margin:0 0 10px;word-break:break-word;white-space:pre-line}
  .row-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .sub-h{font-family:var(--serif);font-size:20px;margin:22px 0 8px}
  .toast{pointer-events:none;position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (min-width:900px){
    body{padding-bottom:30px}
    .tabs{display:none}
  }
</style>
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Open menu">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand" id="brandName"></div>
  <div class="top-right">
    <button class="icon-btn badge-dot" aria-label="Notifications" data-go="notifications">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3a2 2 0 0 0-4 0v1.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg>
    </button>
    <button class="icon-btn" aria-label="Account" data-go="account">
      <span class="avatar"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.4 3.8-7 8.5-7s8.5 2.6 8.5 7z"/></svg></span>
    </button>
  </div>
</header>

<!-- Drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Main navigation">
  <div class="profile">
    <div class="big-avatar"><svg width="52" height="52" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.4 3.8-7 8.5-7s8.5 2.6 8.5 7z"/></svg></div>
    <h2 id="pName"></h2>
    <div class="meta" id="pId"></div>
    <div class="meta" id="pUser"></div>
    <div class="meta" id="pBal"></div>
    <div class="meta" id="pAvail"></div>
    <div class="status">Status: <b id="pStatus"></b></div>
  </div>
  <div class="nav-title">Navigation</div>
  <button class="nav-item active" data-go="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3z"/></svg>My page</button>

  <button class="nav-item" data-toggle="sub-student" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.4 3.8-7 8.5-7s8.5 2.6 8.5 7z"/></svg>Student<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="sub" id="sub-student"><button data-go="profile">Profile</button><button data-go="application">Application</button><button data-go="documents">Documents</button><button data-go="transcript">Transcript</button><button data-go="password">Change password</button></div>

  <button class="nav-item" data-toggle="sub-finance" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2h-2v2.1c-2.3.4-4 1.9-4 4 0 2.5 2 3.4 4.4 4 1.9.5 2.6.9 2.6 1.7 0 .9-.9 1.5-2.2 1.5-1.4 0-2.3-.6-2.5-1.7H7.2c.2 2 1.7 3.3 3.8 3.7V20h2v-2.2c2.4-.4 4-1.9 4-3.9 0-2.4-1.9-3.3-4.3-3.9-2-.5-2.7-1-2.7-1.8 0-.8.8-1.4 2-1.4s2 .6 2.2 1.5h2.2c-.2-1.8-1.5-3.1-3.4-3.5z"/></svg>Finance<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="sub" id="sub-finance"><button data-go="pay">Make payment</button><button data-go="statement">Statement of account</button><button data-go="plan">My payment plan</button></div>

  <button class="nav-item" data-toggle="sub-modules" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/></svg>Modules<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="sub" id="sub-modules"><button data-go="modules">Modules</button><button data-go="prereg">My pre-registrations</button><button data-go="enrol">My enrolments</button></div>

  <button class="nav-item" data-toggle="sub-feedback" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>Feedback<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="sub" id="sub-feedback"><button data-go="suggestions">Suggestions</button><button data-go="modeval">Module evaluation</button><button data-go="syseval">System evaluation</button></div>

  <button class="nav-item hidden" id="adminNav" data-toggle="sub-admin" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></svg>Staff<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="sub" id="sub-admin"><button data-go="adminApps">Applications</button><button data-go="adminPay">Payments</button><button data-go="adminPrereg">Pre-registrations</button></div>

  <button class="nav-item" data-go="help"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 16h-2v-2h2zm1.8-7.6c-.9.8-1.8 1.2-1.8 2.6h-2c0-2 1.1-2.9 2-3.6.6-.5 1-.8 1-1.4 0-.7-.6-1.2-1.4-1.2-.9 0-1.5.6-1.6 1.4H8.9C9 6.6 10.4 5.5 12.1 5.5c1.7 0 3.4 1 3.4 2.7 0 1.1-.6 1.7-.7 2.2z"/></svg>Help</button>
  <hr class="nav-sep">
  <button class="nav-item" id="logoutBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg>Logout</button>
</aside>

<!-- Views -->
<main id="view"></main>

<!-- Bottom tabs -->
<nav class="tabs" aria-label="Quick navigation">
  <button class="tab active" data-go="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3z"/></svg>My page</button>
  <button class="tab" data-go="application"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5M8 12h8v1.6H8zm0 3.5h8v1.6H8z"/></svg>Application</button>
  <button class="tab center" data-go="modules"><span class="orb"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/></svg></span><span class="lbl">Modules</span></button>
  <button class="tab" data-go="help"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 16h-2v-2h2zm1.8-7.6c-.9.8-1.8 1.2-1.8 2.6h-2c0-2 1.1-2.9 2-3.6.6-.5 1-.8 1-1.4 0-.7-.6-1.2-1.4-1.2-.9 0-1.5.6-1.6 1.4H8.9C9 6.6 10.4 5.5 12.1 5.5c1.7 0 3.4 1 3.4 2.7 0 1.1-.6 1.7-.7 2.2z"/></svg>Help</button>
  <button class="tab" data-go="account"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.4 3.8-7 8.5-7s8.5 2.6 8.5 7z"/></svg>Account</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ CONFIG: edit these ============ */
const CONFIG = {
  schoolName: "AVOM Believers Bible School",
  tagline: "Student Portal",
  supportEmail: "avom.global@gmail.com",
  student: {
    name: "Student Name",
    id: "ST-000001",
    username: "student0001",

/* ---------- server calls (Google Apps Script) ---------- */
const DEMO = !(window.google && google.script && google.script.run);
const tokenStore = {
  mem: null,
  get(){ try { return sessionStorage.getItem("sp_token") || this.mem; } catch(e){ return this.mem; } },
  set(t){ this.mem = t; try { t ? sessionStorage.setItem("sp_token", t) : sessionStorage.removeItem("sp_token"); } catch(e){} }
};
function api(fn, ...args){
  if (DEMO) return Promise.resolve({ ok:true, data:null, demo:true });
  return new Promise(resolve => {
    google.script.run
      .withSuccessHandler(r => resolve(r || { ok:false, error:"No response from the server." }))
      .withFailureHandler(() => resolve({ ok:false, error:"Can't reach the server. Check your connection and try again." }))
      [fn](...args);
  });
}
async function authed(fn, ...args){
  const r = await api(fn, tokenStore.get(), ...args);
  if (!r.ok && r.code === "SESSION") { tokenStore.set(null); showAuth("Your session expired. Sign in again."); }
  return r;
}
async function logout(){
  if (DEMO) { toast("Demo mode. Sign-in works once this is deployed to Apps Script."); return; }
  await api("logout", tokenStore.get());
  tokenStore.set(null);
  showAuth("You've signed out.");
}

/* routing */
const views = {};
function go(name){
  if (!views[name]) name = "home";
  $("#view").innerHTML = views[name]() + footer();
  const after = views[name].after; if (after) after();
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.go === name));
  $$(".sub button").forEach(b => b.classList.toggle("active", b.dataset.go === name));
  $$(".nav-item[data-toggle]").forEach(h => {
    const sub = document.getElementById(h.dataset.toggle), hit = !!$(".sub button.active", sub);
    h.classList.toggle("active", hit);
    if (hit) { sub.classList.add("open"); h.setAttribute("aria-expanded","true"); }
  });
  $$(".nav-item[data-go]").forEach(t => t.classList.toggle("active", t.dataset.go === name));
  closeDrawer();
  window.scrollTo(0,0);
}
document.addEventListener("click", e => {
  const a = e.target.closest("a");

  const of = e.target.closest("[data-offers]");
  if (of) { store.offerFor = of.dataset.offers; go("offers"); return; }

});

/* ---------- sign in / create account ---------- */
async function showAuth(msg){
  document.body.classList.add("auth"); closeDrawer(); window.scrollTo(0,0); S.admin = false; $("#adminNav").classList.add("hidden");
  let programmes = [];
  const pc = await api("getPublicConfig");
  if (pc.ok && pc.data) programmes = pc.data.programmes;
  $("#view").innerHTML = `<div class="auth-card">
    <div class="brand">${esc(CONFIG.schoolName)}<small>${esc(CONFIG.tagline)}</small></div>
    <h1 id="authTitle">Sign in</h1>
    ${msg ? `<div class="info">${esc(msg)}</div>` : ""}
    <form id="loginForm" class="panel" novalidate><div class="body">
      ${F("Username", `<input name="username" autocomplete="username" required>`, "Enter your username.")}
      ${F("Password", `<input name="password" type="password" autocomplete="current-password" required>`, "Enter your password.")}
      <button class="btn primary block" type="submit">Sign in</button>
    </div></form>
    <form id="regForm" class="panel hidden" novalidate><div class="body">
      ${F("Full name", `<input name="name" autocomplete="name" required>`, "Enter your full name.")}
      ${F("Email", `<input name="email" type="email" autocomplete="email" required>`, "Enter a valid email address.")}
      ${F("Username", `<input name="username" autocomplete="username" pattern="[A-Za-z0-9._\\-]{3,30}" required>`, "Use 3 to 30 letters, numbers, dots, dashes or underscores.")}
      ${F("Programme", `<select name="programme" required><option value="">Select…</option>${programmes.map(p=>`<option>${esc(p)}</option>`).join("")}</select>`, "Choose a programme.")}
      ${F("Password", `<input name="password" type="password" autocomplete="new-password" minlength="8" required>`, "Use at least 8 characters.")}
      ${F("Confirm password", `<input name="conf" type="password" autocomplete="new-password" required>`, "Confirm your password.")}
      <button class="btn primary block" type="submit">Create account</button>
    </div></form>
    <form id="reqForm" class="panel hidden" novalidate><div class="body">
      <p class="hint" style="margin-bottom:12px">Enter your username or email. If an account matches, we'll email you a 6-digit code.</p>
      ${F("Username or email", `<input name="identifier" autocomplete="username" required>`, "Enter your username or email.")}
      <button class="btn primary block" type="submit">Email me a code</button>
    </div></form>
    <form id="resetForm" class="panel hidden" novalidate><div class="body">
      <p class="hint" style="margin-bottom:12px">Check your email for the code. It works for 30 minutes.</p>
      ${F("6-digit code", `<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>`, "Enter the 6-digit code from the email.")}
      ${F("New password", `<input name="password" type="password" autocomplete="new-password" minlength="8" required>`, "Use at least 8 characters.")}
      ${F("Confirm new password", `<input name="conf" type="password" autocomplete="new-password" required>`, "Confirm your new password.")}
      <button class="btn primary block" type="submit">Set new password</button>
    </div></form>
    <form id="verifyForm" class="panel hidden" novalidate><div class="body">
      <p class="hint" style="margin-bottom:12px">We emailed a 6-digit code to the address you signed up with. Enter it to finish creating your account.</p>
      ${F("6-digit code", `<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>`, "Enter the 6-digit code from the email.")}
      <button class="btn primary block" type="submit">Verify email</button>
      <button class="btn ghost block" type="button" id="resendBtn" style="margin-top:10px">Send a new code</button>
    </div></form>
    <p><a href="#" id="authSwap">Create an account</a></p>
    <p id="forgotP"><a href="#" id="forgotLink">Forgot your password?</a></p>
  </div>`;
  let pane = "login", resetId = "", verifyId = "", pendingPw = "";
  const titles = { login:"Sign in", reg:"Create account", req:"Reset password", reset:"Choose a new password", verify:"Verify your email" };
  const show = k => {
    pane = k;
    ["login","reg","req","reset","verify"].forEach(n => $("#" + n + "Form").classList.toggle("hidden", n !== k));
    $("#authTitle").textContent = titles[k];
    $("#authSwap").textContent = k === "login" ? "Create an account" : "Back to sign in";
    $("#forgotP").classList.toggle("hidden", k !== "login");
  };
  $("#authSwap").onclick = () => show(pane === "login" ? "reg" : "login");
  $("#forgotLink").onclick = () => show("req");
  bindForm("reqForm", async d => {
    const r = await api("requestReset", d.identifier);
    if (!r.ok) { toast(r.error); return; }
    resetId = d.identifier; toast("If an account matches, we've emailed a code."); show("reset");
  });
  bindForm("resetForm", async (d,f) => {
    if (d.password !== d.conf) { toast("The passwords don't match."); return; }
    const r = await api("resetPassword", resetId, d.code, d.password);
    if (!r.ok) { toast(r.error); return; }
    f.reset(); show("login"); toast("Password changed. Sign in with your new password.");
  });
  bindForm("verifyForm", async (d,f) => {
    const r = await api("verifyEmail", verifyId, d.code);
    if (!r.ok) { toast(r.error); return; }
    if (pendingPw) {
      const l = await api("login", verifyId, pendingPw); pendingPw = "";
      if (l.ok) { tokenStore.set(l.data.token); await boot(); return; }
    }
    f.reset(); show("login"); toast("Email verified. Sign in.");
  });
  $("#resendBtn").onclick = async () => {
    const r = await api("resendVerification", verifyId);
    toast(r.ok ? "If that account is waiting for verification, we've sent a new code." : r.error);
  };
  bindForm("loginForm", async d => {
    const r = await api("login", d.username, d.password);
    if (!r.ok && r.code === "VERIFY") { verifyId = d.username; pendingPw = d.password; show("verify"); toast(r.error); return; }
    if (!r.ok) { toast(r.error); return; }
    tokenStore.set(r.data.token); await boot();
  });
  bindForm("regForm", async d => {
    if (d.password !== d.conf) { toast("The passwords don't match."); return; }
    const r = await api("register", { name:d.name, email:d.email, username:d.username, programme:d.programme, password:d.password });
    if (!r.ok) { toast(r.error); return; }
    if (r.data && r.data.verify) {
      verifyId = d.username; pendingPw = d.password; show("verify");
      toast(r.data.emailed ? "We emailed you a 6-digit code." : "Verification emails are busy. Tap Send a new code in a little while.");
      return;
    }
    const l = await api("login", d.username, d.password);
    if (!l.ok) { toast(l.error); return; }
    tokenStore.set(l.data.token); await boot();
  });
}

async function boot(){
  if (DEMO) { document.body.classList.remove("auth"); go("home"); return; }
  const t = tokenStore.get();
  if (!t) { showAuth(); return; }
  const r = await api("bootstrap", t);
  if (!r.ok) { tokenStore.set(null); showAuth(r.code === "SESSION" ? "" : r.error); return; }
  const d = r.data;
  Object.assign(S, d.student);
  CONFIG.programme = d.student.programme;
  store.application = d.application || {};
  store.nok = d.nok || null;
  store.docs = d.documents || [];
  if (d.modules && d.modules.length) CONFIG.moduleGroups = d.modules;
  store.preregs = d.preregs || []; store.enrols = d.enrolments || [];
  store.payInfo = d.payInfo || ""; store.payMethods = d.payMethods || store.payMethods; store.statuses = d.statuses || store.statuses;
  $("#adminNav").classList.toggle("hidden", !S.admin);
  CONFIG.checklist[1].done = !!d.application;
  CONFIG.checklist[2].done = !!(d.application && d.application.complete);
  renderProfile();
  document.body.classList.remove("auth");
  go("home");
}
boot();
